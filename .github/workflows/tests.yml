name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python tools/make_demo_data.py
          python -m tencre asar list build/demo/demo.asar
          python -m tencre scan build/demo/src_tree --kind url
          python -m tencre wxdat build/demo/wechat_dat --out build/demo/out --quiet